[alembic]
script_location = alembic
prepend_sys_path = .

# The real URL is built at runtime in alembic/env.py from ALIBI_DATABASE_URL
# (same DSN the app itself uses, translated the same way as app/db/engine.py)
# — nothing sensitive lives in this file, so it's safe to commit.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
