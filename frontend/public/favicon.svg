<!--
  ALIBI favicon — the brand mark from src/components/ui/Logo.tsx.
  Strokes are heavier here (6/5 vs 5/4) so the ring and the breaking
  measure survive 16px, and the colours are literal hex because a
  standalone SVG never sees tokens.css. Keep in sync with Logo.tsx
  and the data-1 / data-6 / data-2 tokens.

  NOTE: no double hyphen anywhere in this comment. XML forbids it inside
  a comment, and a browser that cannot parse the file silently falls back
  to its default globe icon.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="g" x1="8" y1="40" x2="40" y2="6" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#27F5A9"/>
      <stop offset="0.55" stop-color="#5BE6C2"/>
      <stop offset="1" stop-color="#4FD2FF"/>
    </linearGradient>
  </defs>

  <rect width="48" height="48" rx="11" fill="#0a0a0c"/>

  <g transform="translate(24 24) scale(0.84) translate(-24 -24)"
     stroke="url(#g)" stroke-linecap="round">
    <!-- the conversation: a 270° ring, open toward the top-right -->
    <path d="M37.95 20.78 A14 14 0 1 1 22.78 8.05" stroke-width="6"/>
    <!-- the answer -->
    <path d="M17.5 27 V25" stroke-width="5" opacity="0.65"/>
    <path d="M24 27 V21" stroke-width="5" opacity="0.85"/>
    <!-- the one that leaves -->
    <path d="M30.5 27 V7" stroke-width="5"/>
  </g>
</svg>
